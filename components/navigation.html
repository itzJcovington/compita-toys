        <div class="navigation-container4">
          <div class="navigation-container5">
            <script defer="" data-name="navigation-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const navToggle = document.getElementById("navToggle")
                  const navClose = document.getElementById("navClose")
                  const mobileOverlay = document.getElementById("mobileOverlay")
                  const body = document.body

                  const openMenu = () => {
                    mobileOverlay.classList.add("is-active")
                    navToggle.setAttribute("aria-expanded", "true")
                    body.style.overflow = "hidden"
                  }

                  const closeMenu = () => {
                    mobileOverlay.classList.remove("is-active")
                    navToggle.setAttribute("aria-expanded", "false")
                    body.style.overflow = ""
                  }

                  navToggle.addEventListener("click", openMenu)
                  navClose.addEventListener("click", closeMenu)

                  const mobileLinks = mobileOverlay.querySelectorAll(".navigation-mobile-link")
                  mobileLinks.forEach((link) => {
                    link.addEventListener("click", closeMenu)
                  })

                  window.addEventListener("keydown", (e) => {
                    if (e.key === "Escape" && mobileOverlay.classList.contains("is-active")) {
                      closeMenu()
                    }
                  })

                  let lastScroll = 0
                  const nav = document.querySelector(".navigation-container")

                  window.addEventListener("scroll", () => {
                    const currentScroll = window.pageYOffset
                    if (currentScroll > 100) {
                      nav.style.padding = "0"
                      nav.style.boxShadow = "0 10px 30px -10px rgba(0,0,0,0.5)"
                    } else {
                      nav.style.padding = "var(--spacing-xs) 0"
                      nav.style.boxShadow = "none"
                    }
                    lastScroll = currentScroll
                  })
                })()
              });
            </script>
          </div>
        </div>
