            <script defer="" data-name="social-gallery-interactivity">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const galleryItems = document.querySelectorAll(".social-gallery-item")

                  galleryItems.forEach((item, index) => {
                    item.style.opacity = "0"
                    item.style.transform = "translateY(20px)"

                    const observer = new IntersectionObserver(
                      (entries) => {
                        entries.forEach((entry) => {
                          if (entry.isIntersecting) {
                            setTimeout(() => {
                              entry.target.style.transition = "all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1)"
                              entry.target.style.opacity = "1"
                              entry.target.style.transform = "translateY(0)"
                            }, index * 100)
                            observer.unobserve(entry.target)
                          }
                        })
                      },
                      { threshold: 0.1 }
                    )

                    observer.observe(item)
                  })

                  galleryItems.forEach((item) => {
                    item.addEventListener("click", () => {
                      const platform = item.querySelector(".social-gallery-platform-icon").classList.contains("social-gallery-platform-icon") ? "Social Media" : "Post"
                      console.log(`Navigating to ${platform} post...`)
                    })
                  })
                })()
              });
